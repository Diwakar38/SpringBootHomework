jwt:
  secretKey: jsd273462387rqeiuhewiwerlskdfjlsadjklsdjfklsdjfklsdj

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name: LoggingOrdersFilter
                - name: Authentication
                  args:
                    isEnabled: true
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - name: Authentication
                  args:
                    isEnabled: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8080